name: swing_meanrev_l2
family: swing_meanrev
version: "2.0.0"
parent_id: "swing_meanrev_v1"
bucket: SWING
author: system
description: "L2 enhanced: LightGBM ML classifier + RSI(2) mean reversion + Market Regime gating"

universe:
  min_adv_usd: 15000000.0
  min_price: 10.0
  exclude_otc: true
  symbols: []

rebalance:
  schedule: daily
  time: "15:45 America/New_York"

signals:
  - provider: l2_lightgbm
    weight: 0.45
    params:
      model_id: "lgbm_dir_5d_v1"
      model_version: "1.0.0"
  - provider: l1_rsi
    weight: 0.35
    params:
      period: 2
      oversold: 10.0
      overbought: 90.0
      mode: mean_reversion
  - provider: l2_market_regime
    weight: 0.20
    params:
      benchmark: SPY

aggregator:
  type: weighted_confidence
  min_confidence: 0.25

policy:
  type: threshold_long_only
  n: 10
  min_score: 0.25
  enter_threshold: 0.35
  exit_threshold: -0.10
  weight_by: inverse_vol
  max_position_pct: 0.10

stop:
  type: hard_pct
  pct: 0.05

costs:
  model: default_v1
  k: 1.0
  broker: alpaca
