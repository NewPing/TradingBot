name: core_trend_l3
family: core_trend
version: "3.0.0"
parent_id: "core_trend_l2"
bucket: CORE
author: system
description: "L3 enhanced: Cross-sectional 12-1m momentum + L3 Fundamental GARP quality/value filter + Market Regime"

universe:
  min_adv_usd: 20000000.0
  min_price: 5.0
  exclude_otc: true
  symbols: []

rebalance:
  schedule: monthly_last_trading_day
  time: "15:45 America/New_York"

signals:
  - provider: l2_cs_momentum
    weight: 0.35
    params:
      skip_bars: 21
      lookback_bars: 252
  - provider: l3_val_quality
    weight: 0.35
    params:
      min_roic: 0.08
      max_accrual_ratio: 0.05
      min_fcf_yield: 0.02
      max_ev_ebitda: 25.0
  - provider: l2_market_regime
    weight: 0.20
    params:
      benchmark: SPY
  - provider: l1_trend_filter
    weight: 0.10
    params:
      ma_period: 200
      ma_type: sma

aggregator:
  type: weighted_confidence
  min_confidence: 0.25

policy:
  type: top_n_long_only
  n: 5
  min_score: 0.25
  weight_by: inverse_vol
  max_position_pct: 0.20

stop:
  type: atr_trailing
  atr_period: 14
  multiple: 3.0

costs:
  model: default_v1
  k: 1.0
  broker: alpaca
