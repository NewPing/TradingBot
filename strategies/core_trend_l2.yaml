name: core_trend_l2
family: core_trend
version: "2.0.0"
parent_id: "core_trend_v1"
bucket: CORE
author: system
description: "L2 enhanced: Cross-sectional 12-1m ranking + Market Regime + 200 SMA trend"

universe:
  min_adv_usd: 20000000.0
  min_price: 5.0
  exclude_otc: true
  symbols: []

rebalance:
  schedule: monthly_last_trading_day
  time: "15:45 America/New_York"

signals:
  - provider: l2_cs_momentum
    weight: 0.45
    params:
      skip_bars: 21
      lookback_bars: 252
  - provider: l2_market_regime
    weight: 0.30
    params:
      benchmark: SPY
  - provider: l1_trend_filter
    weight: 0.25
    params:
      ma_period: 200
      ma_type: sma

aggregator:
  type: weighted_confidence
  min_confidence: 0.25

policy:
  type: top_n_long_only
  n: 5
  min_score: 0.20
  weight_by: inverse_vol
  max_position_pct: 0.20

stop:
  type: atr_trailing
  atr_period: 14
  multiple: 3.0

costs:
  model: default_v1
  k: 1.0
  broker: alpaca
